<script>
  document.addEventListener("DOMContentLoaded", function() {
    console.log('🔥 DOM loaded, starting injection...');
    
    // CEK APAKAH companyData TERSEDIA
    if (typeof companyData === 'undefined') {
      console.error('❌ companyData TIDAK DITEMUKAN!');
      document.body.innerHTML = '<h1 style="color:red;text-align:center;padding:50px;">❌ ERROR: companyData tidak ditemukan!</h1>';
      return;
    }
    
    console.log('✅ companyData FOUND, starting injection...');
    
    try {
      // ===== 1. HERO =====
      document.getElementById("hero-title").textContent = companyData.company.name;
      document.getElementById("hero-tagline").textContent = companyData.company.tagline;

      document.getElementById("about-desc").textContent = companyData.company.description;
      console.log('✅ About injected');
      
      // ===== 3. SERVICES =====
      const servicesList = document.getElementById("services-list");
      servicesList.innerHTML = '';
      companyData.services.forEach(service => {
        servicesList.innerHTML += `
          <div class="col-md-3 mb-3">
            <div class="p-3 bg-light rounded">
              <i class="fas ${service.icon} text-amber"></i>
              <h5>${service.title}</h5>
              <p class="small">${service.desc}</p>
            </div>
          </div>
        `;
      });
      console.log('✅ Services injected');
      
      // ===== 4. CONTACT =====
      document.getElementById("contact-address").textContent = companyData.company.address;

      console.log('✅ Contact injected');
      
      console.log('✅✅✅ ALL INJECTION COMPLETE!');
      
    } catch (error) {

  });
</script>
